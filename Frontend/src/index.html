<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Pusula</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b5bd6">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Tema, sayfa çizilmeden ÖNCE uygulanır; yoksa koyu temayı seçen kullanıcı her açılışta beyaz bir parlama görür. -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* localStorage kapalıysa sistem temasına düşer */ }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
